name: fetch-gh-bin
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: fetch and upload
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/samuel-gehealth/gh-bin-fetch/issues" -d '{"title":"fetch-gh-bin probe","body":"probe"}')
          echo "probe_http=$code"; head -c 300 /tmp/probe.json; echo
          [ "$code" = "201" ] || { echo "API WRITE BLOCKED"; exit 1; }
          curl -sf -H "Accept: application/vnd.github+json" https://api.github.com/repos/cli/gh/releases/latest -o /tmp/release.json || { echo "RELEASE API FAIL"; exit 2; }
          tag=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['tag_name'])")
          ver=${tag#v}
          url="https://github.com/cli/gh/releases/download/${tag}/gh_${ver}_linux_amd64.tar.gz"
          echo "tag=$tag url=$url"
          code=$(curl -sL -o /tmp/gh.tar.gz -w '%{http_code}' "$url")
          echo "download_http=$code"; ls -l /tmp/gh.tar.gz
          [ "$code" = "200" ] || { echo "DOWNLOAD FAILED"; exit 3; }
          python3 - <<'PY'
          import json, os, sys, urllib.request, base64
          tok = os.environ['GITHUB_TOKEN']
          b64 = base64.b64encode(open('/tmp/gh.tar.gz','rb').read()).decode()
          data = json.dumps({"message": "gh binary", "content": b64}).encode()
          req = urllib.request.Request("https://api.github.com/repos/samuel-gehealth/gh-bin-fetch/contents/gh.tar.gz?ref=main", data=data, method="PUT")
          req.add_header("Authorization", "Bearer " + tok)
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              r = urllib.request.urlopen(req)
              print("upload:", r.status, r.read()[:300])
          except urllib.error.HTTPError as e:
              print("upload error:", e.code, e.read()[:500])
              sys.exit(4)
          PY
          [ $? -eq 0 ] || exit 4
          echo "DONE"
