name: diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: push-test
        run: |
          git init -q /tmp/w; cd /tmp/w
          git config user.email a@b.c; git config user.name a
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/samuel-gehealth/gh-bin-fetch.git"
          echo probe > s.txt; git add s.txt; git commit -q -m s
          git push origin HEAD:tools/gh-diag --force
